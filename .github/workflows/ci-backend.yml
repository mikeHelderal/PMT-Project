name: Backend CI-CD

on:
  push:
    branches: [ "develop", "master" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # `verify` (et non `package`) : c'est la phase qui déclenche le rapport
      # JaCoCo et le contrôle du seuil de couverture de 60 %.
      - name: Build, test and check coverage
        run: mvn clean verify -Dsurefire.showSuccess=false

      # Le rapport reste téléchargeable depuis l'onglet Actions, même si
      # une étape ultérieure échoue.
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: target/site/jacoco/
          retention-days: 30

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: target/surefire-reports/
          retention-days: 30

      # Déploiement : uniquement sur push de branche. Une pull request
      # exécute les tests sans publier d'image.
      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          # `latest` pour le déploiement courant, le SHA pour pouvoir revenir en arrière
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/pmt-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/pmt-backend:${{ github.sha }}
