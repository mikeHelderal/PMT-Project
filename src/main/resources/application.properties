spring.application.name=pmt
server.port=8081

# --- Base de donnees -------------------------------------------------------
# Les valeurs par defaut ciblent une base locale ; en conteneur, elles sont
# surchargees par les variables d'environnement du docker-compose.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/pmt_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- Notifications e-mail --------------------------------------------------
# Identifiants JAMAIS versionnes : voir .env.example puis renseigner .env
# (ou exporter SPRING_MAIL_USERNAME / SPRING_MAIL_PASSWORD).
spring.mail.host=${SPRING_MAIL_HOST:sandbox.smtp.mailtrap.io}
spring.mail.port=${SPRING_MAIL_PORT:2525}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.debug=false
